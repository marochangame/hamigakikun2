<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>はみがきくん2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app" aria-label="はみがきゲーム">
    <div class="spark s1">✦</div><div class="spark s2">✨</div><div class="spark s3">✦</div><div class="spark s4">✨</div>
    <section class="stage" id="stage">
      <div class="fairy fairy-pink">★</div><div class="fairy fairy-blue">★</div><div class="fairy fairy-green">★</div><div class="fairy fairy-yellow">★</div>
      <div class="mouth" id="mouth">
        <div class="gum top"></div><div class="gum bottom"></div><div class="throat"></div><div class="tongue"></div>
        <div class="teeth top-teeth" id="topTeeth"></div>
        <div class="teeth bottom-teeth" id="bottomTeeth"></div>
        <div class="germs" id="germs"></div>
        <div class="brush" id="brush"><div class="foam"></div><div class="head"><i></i><i></i><i></i><i></i><i></i></div><div class="handle"></div></div>
        <div class="bubbles" id="bubbles"></div>
      </div>
    </section>
    <button class="start" id="startBtn" type="button">スタート</button>
    <section class="finish" id="finish" aria-hidden="true"><div class="star">⭐</div><h1>はみがき できた！</h1><p>もう一回する？</p><button id="againBtn" type="button">もういっかい</button></section>
    <div class="rotate">よこ向きにしてね</div>
  </main>
<script src="app.js"></script>
</body>
</html>
