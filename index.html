<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8feee4" />
  <title>はみがき90びょう</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style-v13.css?v=13" />
</head>
<body>
  <main class="app" id="app">
    <img src="kawaii_ui.jpg" class="base-art" alt="はみがき90びょう" draggable="false" />

    <div class="germ-clean g1"><span>✨</span></div>
    <div class="germ-clean g2"><span>✦</span></div>
    <div class="germ-clean g3"><span>✨</span></div>
    <div class="germ-clean g4"><span>✦</span></div>
    <div class="germ-clean g5"><span>✨</span></div>
    <div class="germ-clean g6"><span>✦</span></div>

    <div class="sparkle-layer" id="sparkleLayer" aria-hidden="true"></div>

    <button class="start-btn" id="startBtn" type="button" aria-label="スタート">スタート</button>

    <div class="finish" id="finish" aria-live="polite">
      <div class="finish-card">
        <div class="finish-star">⭐</div>
        <div class="finish-main">はみがき できた！</div>
        <div class="finish-sub">もう一回する？</div>
        <button class="again-visible" id="againVisible" type="button">もういっかい</button>
      </div>
    </div>
  </main>
  <div class="rotate">よこ向きにしてね</div>
  <script src="app-v13.js?v=13"></script>
</body>
</html>
