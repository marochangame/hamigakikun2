<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#8feee4" />
  <title>はみがき90びょう</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style-v11.css?v=13" />
</head>
<body>
  <main class="app" id="app">
    <img src="kawaii_ui.jpg?v=13" class="base-art" alt="" draggable="false" />

    <div class="clean-layer" aria-hidden="true">
      <div class="germ-cover g1"><span>✦</span><b>✨</b></div>
      <div class="germ-cover g2"><span>✦</span><b>✨</b></div>
      <div class="germ-cover g3"><span>✦</span><b>✨</b></div>
      <div class="germ-cover g4"><span>✦</span><b>✨</b></div>
      <div class="germ-cover g5"><span>✦</span><b>✨</b></div>
      <div class="germ-cover g6"><span>✦</span><b>✨</b></div>
    </div>

    <div class="mini-sparkles" id="sparkleLayer" aria-hidden="true">
      <span class="sp s1">✦</span><span class="sp s2">✨</span><span class="sp s3">✧</span>
      <span class="sp s4">✦</span><span class="sp s5">✨</span><span class="sp s6">✧</span>
      <span class="sp s7">✦</span><span class="sp s8">✨</span><span class="sp s9">✧</span>
      <span class="sp s10">✦</span><span class="sp s11">✨</span><span class="sp s12">✧</span>
    </div>

    <button class="apple-btn start-btn" id="startBtn" type="button" aria-label="リンゴを押して歯磨き始めてね">🍎</button>

    <div class="finish" id="finish" aria-live="polite">
      <button class="apple-btn again-visible" id="againVisible" type="button" aria-label="もう一度歯磨きするならリンゴを押してね">🍎</button>
    </div>

    <audio id="song" preload="auto" src="hamigaki_song.m4a"></audio>
  </main>
  <div class="rotate">よこ向きにしてね</div>
  <script src="app-v11.js?v=13"></script>
</body>
</html>
